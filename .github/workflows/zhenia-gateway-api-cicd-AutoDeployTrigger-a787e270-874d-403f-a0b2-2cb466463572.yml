name: Trigger auto deployment for zhenia-gateway-api-cicd

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/zhenia-gateway-api-cicd-AutoDeployTrigger-a787e270-874d-403f-a0b2-2cb466463572.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ZHENIAGATEWAYAPICICD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ZHENIAGATEWAYAPICICD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ZHENIAGATEWAYAPICICD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/nodejs-microservices
          dockerfilePath: /packages/gateway-api/Dockerfile
          _targetLabelKey_: _targetLabel_
          registryUrl: containerrgk00rn1q.azurecr.io
          registryUsername: ${{ secrets.ZHENIAGATEWAYAPICICD_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ZHENIAGATEWAYAPICICD_REGISTRY_PASSWORD }}
          containerAppName: zhenia-gateway-api-cicd
          resourceGroup: Workshop-Zhenia-Group
          imageToBuild: containerrgk00rn1q.azurecr.io/zhenia-gateway-api-cicd:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


